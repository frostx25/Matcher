name: Supabase CI

on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase-ci.yml']
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase-ci.yml']

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase test db
