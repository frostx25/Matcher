<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="robots" content="noindex">
  <title>Continuar no VibeAli</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 20%,#35152d 0,transparent 38%),#0b0b0f;color:#fff7fb;font-family:system-ui,sans-serif}.card{width:min(100%,560px);padding:48px;border:1px solid #493443;background:rgba(23,16,27,.88);border-radius:16px;box-shadow:0 32px 90px #0008}.mark{display:grid;place-items:center;width:58px;height:58px;border-radius:20px;background:linear-gradient(145deg,#ff2d7a,#8b78ff);font-size:28px;font-weight:800}h1{font-size:clamp(2.4rem,8vw,4rem);line-height:.95;letter-spacing:-.06em;margin:32px 0 18px}p{color:#c9bbc4;line-height:1.6}.button{display:inline-block;margin-top:20px;padding:15px 20px;background:#fff7fb;color:#0b0b0f;border-radius:8px;text-decoration:none;font-weight:700}.home{display:block;margin-top:24px;color:#ff6b8f;text-decoration:none;font-size:.9rem}@media(max-width:520px){.card{padding:32px 24px}}
  </style>
</head>
<body>
  <main class="card">
    <span class="mark" aria-hidden="true">V</span>
    <h1>Tudo certo<br>por aqui.</h1>
    <p>Sua confirmação foi concluída. Continue no aplicativo para entrar na sua conta.</p>
    <a class="button" href="vibeali://auth-callback">Abrir o VibeAli</a>
    <a class="home" href="/">Voltar ao site</a>
  </main>
</body>
</html>
