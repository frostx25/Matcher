version: 6
domain: direct-chat

scenarios:
  - id: CHAT-001-free-quota
    name: Free abre conversa ativa imediatamente
    given:
      - user: user-free
      - quota_new_conversations: 5
      - recipient: user-target-01
    when:
      - send_first_message: "Oi, tudo bem?"
    then:
      - create_active_conversation: true
      - first_message_delivered: true
      - quota_new_conversations: 4
      - recipient_acceptance_required: false

  - id: CHAT-002-sixth-blocked
    name: Sexta abertura do Free é bloqueada
    given:
      - user: user-free
      - quota_new_conversations: 0
      - recipient: user-target-06
    when:
      - send_first_message: "Olá"
    then:
      - create_active_conversation: false
      - error: CHAT_QUOTA_EXHAUSTED
      - quota_error_visible: true
      - preserve_existing_conversations: true

  - id: CHAT-003-existing-does-not-consume
    name: Mensagem em conversa ativa não consome nova abertura
    given:
      - user: user-free
      - quota_new_conversations: 0
      - conversation_state: active
    when:
      - send_message: "Continuando nossa conversa"
    then:
      - message_delivered: true
      - quota_new_conversations: 0

  - id: CHAT-004-no-acceptance
    name: Primeiro envio dispensa aceite do destinatário
    given:
      - conversation_between_users: false
      - quota_new_conversations: 5
    when:
      - sender_sends_first_message: true
    then:
      - conversation_state: active
      - visible_to_sender: true
      - visible_to_recipient: true
      - recipient_acceptance_required: false

  - id: CHAT-005-block
    name: Bloqueio interrompe contato
    given:
      - conversation_state: active
    when:
      - participant_action: block
    then:
      - conversation_visible_to_both: false
      - new_messages_allowed: false
      - discovery_visibility_between_users: false

  - id: CHAT-006-atomic-quota
    name: Quota não sofre corrida concorrente
    given:
      - user: user-free
      - quota_new_conversations: 1
      - two_concurrent_first_messages: true
    when:
      - submit_both_openings: true
    then:
      - successful_conversation_openings: 1
      - rejected_openings: 1
      - quota_new_conversations: 0

  - id: CHAT-007-client-boundary
    name: Cliente consome a decisão de quota sem decrementar sozinho
    given:
      - adapter: authoritative-chat-repository
      - user: user-free
      - quota_new_conversations: 0
      - recipient: user-target-07
    when:
      - send_first_message: "Olá"
    then:
      - create_active_conversation: false
      - error: CHAT_QUOTA_EXHAUSTED
      - quota_new_conversations: 0
      - quota_error_visible: true

  - id: CHAT-008-report-active
    name: Denúncia de conversa cria caso de moderação
    given:
      - conversation_state: active
      - current_user_is_participant: true
    when:
      - participant_action: report
      - report_reason: SPAM
      - report_details: "Conteúdo sintético para teste"
    then:
      - moderation_case_created: true
      - reported_user_can_continue_sending: false
      - sensitive_content_logged: false

  - id: CHAT-009-blocked-opening
    name: Relação bloqueada impede nova abertura
    given:
      - blocker: user-target-09
      - blocked: user-free
      - conversation_between_users: false
    when:
      - blocked_user_sends_first_message: true
    then:
      - create_active_conversation: false
      - error: CHAT_BLOCKED
      - quota_consumed: false

  - id: CHAT-010-existing-pair
    name: Par existente não cria segunda conversa
    given:
      - conversation_state: active
      - quota_new_conversations: 4
    when:
      - send_message_from_profile: "Outra mensagem"
    then:
      - duplicate_conversation_created: false
      - message_delivered_to_existing_conversation: true
      - quota_new_conversations: 4

  - id: CHAT-011-active-message
    name: Conversa direta permite resposta sem consumir quota
    given:
      - conversation_state: active
      - quota_new_conversations: 4
    when:
      - send_message: "Que bom falar com você"
    then:
      - message_delivered: true
      - message_visible_in_conversation: true
      - quota_new_conversations: 4

  - id: CHAT-012-age-gate
    name: Conta sem aferição não lê nem envia em conversa existente
    given:
      - conversation_state: active
      - account_status: pending
      - age_verification_status: not_started
    when:
      - list_conversations: true
      - send_message: "Tentativa sem verificação"
    then:
      - conversations_returned: 0
      - message_delivered: false
      - error: ACCOUNT_NOT_ACTIVE

  - id: CHAT-013-both-participants-active
    name: Conversa só permanece acessível quando os dois participantes estão ativos
    given:
      - conversation_state: active
      - sender_age_verification_status: verified
      - recipient_account_status: suspended
    when:
      - sender_sends_message: true
    then:
      - message_delivered: false
      - conversation_visible_to_sender: false

  - id: CHAT-014-active-conversation-actions
    name: Conversa ativa mantém álbum compositor e segurança acessíveis
    given:
      - conversation_state: active
      - current_user_is_participant: true
      - other_profile_public_media_status: approved
      - received_private_album_access: true
      - viewer_private_album_available: true
    when:
      - open_active_conversation: true
    then:
      - back_and_public_identity_visible: true
      - composer_visible_without_scroll: true
      - received_album_action_separate_from_own_album_share: true
      - block_and_report_available_from_safety_menu: true
      - private_album_thumbnail_visible: false
      - empty_message_send_enabled: false
      - conversation_requires_match_or_acceptance: false

  - id: CHAT-015-list-and-first-message
    name: Lista vazia orienta descoberta e primeira mensagem explica abertura direta
    given:
      - active_conversation_count: 0
      - quota_new_conversations: 5
      - recipient: user-target-01
    when:
      - open_conversation_list: true
      - return_to_discovery_from_empty_state: true
      - open_first_message_dialog: true
    then:
      - pending_or_match_sections_visible: false
      - discover_people_action_visible: true
      - recipient_public_identity_visible: true
      - remaining_quota_visible: true
      - direct_opening_consequence_visible: true
      - empty_first_message_send_enabled: false
      - recipient_acceptance_required: false

  - id: CHAT-016-media-choices
    name: Compositor separa foto da liberação de álbum
    given:
      - conversation_state: active
      - viewer_private_album_available: true
    when:
      - open_media_action: true
    then:
      - select_photo_action_visible: true
      - share_or_revoke_album_action_visible: true
      - selecting_photo_grants_album_access: false
      - sharing_album_sends_photo_message: false

  - id: CHAT-017-photo-idempotency-and-moderation
    name: Foto de conversa é idempotente e privada durante moderação
    given:
      - conversation_state: active
      - client_message_key: 70000000-0000-4000-8000-000000000001
      - media_status: pending
    when:
      - repeat_same_photo_intent_twice: true
    then:
      - persisted_photo_messages: 1
      - recipient_can_read_bytes: false
      - sender_sees_status: pending
      - approved_status_required_for_recipient: true

  - id: CHAT-018-read-delivery-and-retry
    name: Leitura e retry são autoritativos
    given:
      - conversation_state: active
      - unread_messages_for_recipient: 2
      - failed_local_message: true
    when:
      - recipient_opens_conversation: true
      - sender_retries_failed_message: true
    then:
      - unread_messages_for_recipient: 0
      - unrelated_conversation_unread_unchanged: true
      - sender_status: read
      - duplicate_message_created: false

  - id: CHAT-019-muted-private-notification
    name: Silêncio impede push e payload não expõe conteúdo
    given:
      - conversation_state: active
      - recipient_muted_conversation: true
    when:
      - sender_sends_photo_or_text: true
    then:
      - message_persisted: true
      - notification_outbox_created: false
      - notification_contains_message_body: false
      - notification_contains_media_path: false

  - id: CHAT-020-report-specific-message
    name: Mensagem ou foto pode ser denunciada sem expor bytes
    given:
      - conversation_state: active
      - reporter_is_recipient: true
      - target_message_kind: photo
    when:
      - report_target_message: true
    then:
      - moderation_case_created: true
      - report_references_authorized_message_id: true
      - reported_media_hidden_for_reporter: true
      - sensitive_content_logged: false
